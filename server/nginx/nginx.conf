worker_processes auto;
# Write errors to stderr so `docker compose logs nginx` surfaces them. Without
# this, a file path sends them into the container FS and they become invisible
# unless you `exec tail` -- which is how we wasted hours chasing a silent 502
# on /janus that never appeared in the access log.
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Rate limiting for control endpoint
    limit_req_zone $binary_remote_addr zone=control:10m rate=100r/s;

    # Upstream definitions
    upstream janus_ws {
        server janus:8188;
        keepalive 32;
    }

    upstream control_relay {
        server control-relay:3001;
        keepalive 32;
    }

    # Per-host server blocks are rendered from /etc/nginx/templates/*.template
    # (envsubst substitutes ${SERVER_DOMAIN} at container start) and written
    # into /etc/nginx/conf.d/.
    include /etc/nginx/conf.d/*.conf;
}
