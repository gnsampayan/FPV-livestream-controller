# FPV kernel tunables. Installed to /etc/sysctl.d/99-fpv.conf by setup.sh.

# Never swap: a swapped page costs milliseconds on an SD card.
vm.swappiness = 0

# Default queueing discipline for any interface without an explicit qdisc.
# fq_codel keeps latency bounded under load. The NetworkManager dispatcher
# script (network/dispatcher/90-fpv-qos) installs CAKE on the uplink itself.
net.core.default_qdisc = fq_codel

# Larger socket buffer ceilings so RTP bursts are not dropped by the kernel
# before GStreamer reads them. (The streams request 64 KiB; this is headroom.)
net.core.rmem_max = 1048576
net.core.wmem_max = 1048576

# Don't let a long TCP idle (SSH, Tailscale control) shrink the congestion
# window and slow the next burst.
net.ipv4.tcp_slow_start_after_idle = 0
