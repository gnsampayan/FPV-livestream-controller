# FPV journald settings. Installed to /etc/systemd/journald.conf.d/fpv.conf.
#
# Keep logs in RAM and cap their size: the services log continuously, and
# writing that to an SD card both wears it out and causes I/O stalls.
# Logs are lost on reboot; use `journalctl -u fpv-video -f` while debugging,
# or temporarily set Storage=persistent when you need history across boots.

[Journal]
Storage=volatile
RuntimeMaxUse=32M
RateLimitIntervalSec=30s
RateLimitBurst=2000
ForwardToSyslog=no
