<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0a0f" />
    <title>FPV Control Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Janus WebRTC Gateway library (UMD build, exposes window.Janus).
         janus.js references a global `adapter` from webrtc-adapter, so that
         must be loaded first or Janus.init() throws
         "ReferenceError: adapter is not defined".

         Served from our own origin (web/public/vendor/) instead of a CDN so
         hard-refreshes don't have to re-fetch ~250KB over the public
         internet. Files are pinned to adapter@9.0.1 and janus-gateway@1.2.2
         and checked in to the repo for reproducible builds. -->
    <script src="/vendor/adapter.js"></script>
    <script src="/vendor/janus.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
